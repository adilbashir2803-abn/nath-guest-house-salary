<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nath Guest House</title>
<style>
body{font-family:Arial;margin:0;background:#f3f5f7;color:#17212b}header{background:#17324d;color:#fff;padding:18px}nav{display:flex;overflow:auto;background:#fff;padding:8px;gap:5px;position:sticky;top:0;z-index:2}button{padding:11px 13px;border:0;border-radius:9px;background:#17324d;color:#fff;margin:4px}input,select{width:96%;padding:11px;margin:5px 0 12px;border:1px solid #ccd5dd;border-radius:8px}.card{background:#fff;border-radius:14px;padding:15px;margin:10px 0;box-shadow:0 2px 8px #0001}.muted{font-size:13px;color:#687786}.danger{background:#a52a2a}main{padding:14px;max-width:700px;margin:auto}@media print{body>*{display:none!important}}
</style></head><body><header><b>Nath Guest House</b><div>Employee Salary Manager</div><div class="muted" style="color:#dce7ef">Zero Bridge, Rajbagh, Srinagar-190008</div></header>
<nav><button onclick="go('dash')">Dashboard</button><button onclick="go('emp')">Employees</button><button onclick="go('pay')">Payments</button><button onclick="go('leave')">Leave</button><button onclick="go('settings')">Settings</button></nav><main id="app"></main>
<script>
const K='NGH_FINAL_1';let db=JSON.parse(localStorage.getItem(K)||'{"pin":"","employees":[],"payments":[],"leave":[]}');
const save=()=>localStorage.setItem(K,JSON.stringify(db)); const money=x=>'₹'+Number(x||0).toLocaleString('en-IN');
function auth(){if(!db.pin){let p=prompt('Create your 4-6 digit PIN');if(!/^\\d{4,6}$/.test(p||''))return false;db.pin=p;save();return true}return prompt('Enter PIN')===db.pin}
function go(p){if(!auth())return;let a=document.getElementById('app');
if(p==='dash')a.innerHTML=`<div class=card><h2>Dashboard</h2><p>Employees: ${db.employees.length}/5</p><p>Total recorded payments: ${money(db.payments.reduce((s,x)=>s+Number(x.amount),0))}</p></div>`;
if(p==='emp'){let list=db.employees.map((e,i)=>`<div class=card><b>${e.name}</b><div class=muted>${e.designation||''} • Joined ${e.joining||''}</div><div>${money(e.salary)}/month</div><button class=danger onclick="del(${i})">Delete</button></div>`).join('');a.innerHTML=`<div class=card><h2>Employees (${db.employees.length}/5)</h2><button onclick="add()">+ Add Employee</button></div>${list||'<div class=card>No employees yet.</div>'}`;}
if(p==='pay'){a.innerHTML=`<div class=card><h2>Record Payment</h2>${db.employees.map((e,i)=>`<button onclick="pay(${i})">${e.name}</button>`).join(' ')}</div><div class=card><h2>Payment History</h2>${db.payments.slice().reverse().map(x=>`<p>${x.name} — ${money(x.amount)} — ${x.type} — ${x.date}</p>`).join('')||'No payments yet.'}</div>`}
if(p==='leave'){a.innerHTML=`<div class=card><h2>Leave</h2>${db.employees.map((e,i)=>`<button onclick="lv(${i})">${e.name}</button>`).join(' ')}</div><div class=card>${db.leave.slice().reverse().map(x=>`<p>${x.name}: ${x.from} to ${x.to} — ${x.days} days</p>`).join('')||'No leave records.'}</div>`}
if(p==='settings')a.innerHTML=`<div class=card><h2>Security</h2><button onclick="pin()">Change PIN</button></div><div class=card><h2>Backup & Restore</h2><p class=muted>Google Drive backup/restore is reserved for the connected production build. Local backup can be created below.</p><button onclick="backup()">Create Backup File</button></div>`}
}
function add(){if(db.employees.length>=5)return alert('Maximum 5 employees.');let n=prompt('Employee name');if(!n)return;let d=prompt('Designation')||'',j=prompt('Joining date')||'',s=prompt('Monthly salary')||'0',c=prompt('Contact number (optional)')||'';db.employees.push({name:n,designation:d,joining:j,salary:+s,contact:c});save();go('emp')}
function del(i){if(confirm('Delete this employee?')){db.employees.splice(i,1);save();go('emp')}}
function pay(i){let e=db.employees[i],amt=prompt('Amount paid to '+e.name);if(!amt)return;let type=prompt('Payment type: Salary / Advance / Bonus / Expense / Other','Salary')||'Salary';let date=new Date().toISOString().slice(0,10);db.payments.push({name:e.name,amount:+amt,type,date});save();if(type==='Salary'&&e.contact){if(confirm('Send SMS to '+e.name+' now?\\n\\n'+money(amt)+' has been paid towards salary.')){let msg='Nath Guest House: Dear '+e.name+', '+money(amt)+' has been paid to you towards your salary.';if(window.Android)Android.sms(e.contact,msg);else alert(msg)}}go('pay')}
function lv(i){let f=prompt('Leave From');if(!f)return;let t=prompt('Leave To');if(!t)return;let d=prompt('Number of days');db.leave.push({name:db.employees[i].name,from:f,to:t,days:d});save();go('leave')}
function pin(){let p=prompt('New 4-6 digit PIN');if(/^\\d{4,6}$/.test(p||'')){db.pin=p;save();alert('PIN changed')}}
function backup(){let b=new Blob([JSON.stringify(db)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='Nath_Guest_House_Backup.json';a.click();URL.revokeObjectURL(u)}
go('dash');
</script></body></html>
